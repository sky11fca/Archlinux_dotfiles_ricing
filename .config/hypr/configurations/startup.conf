exec = xrdb -merge ~/.Xresources
exec-once = dunst &
exec-once = hyprsunset --temperature 2500
exec-once = hyprctl setcursor breeze-dark 24
exec-once = python ~/bin/battery.py
exec-once = waybar &
exec-once = nm-applet &
exec-once = swww-daemon &
exec-once = swww img ~/walls/win7_arch.jpg -t random &
exec-once = /usr/lib64/polkit-kde-authentication-agent-1 &
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
