# GENERAL
general {
    #no_fade_in = false
    #grace = 0
    #disable_loading = true
}

# BACKGROUND
background {
    monitor =
    path = /home/mrbogdanovich/dotfiles/walls/windows10_ahh_arch.webp # Manually point to your wallpaper
    color = rgba(25, 20, 20, 1.0)
    blur_passes = 3 # 0 disables blurring
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# TIME
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(200, 200, 200, 1.0)
    font_size = 120
    font_family = JetBrains Mono Nerd Font ExtraBold
    position = 0, -150
    halign = center
    valign = top
}

# USER PROFILE PICK
image {
    monitor =
    #path = /home/$USER/.face # Path to your profile picture
    size = 150
    border_size = 4
    border_color = rgba(255, 255, 255, 0.6)
    rounding = -1 # Negative means a circle
    position = 0, 75
    halign = center
    valign = center
}

# LOCK SYMBOL
label {
    monitor =
    text = 
    color = rgba(255, 255, 255, 0.6)
    font_size = 25
    font_family = Font Awesome 6 Free Solid
    position = 0, 30
    halign = center
    valign = bottom
}

# PASSWORD PROMPT
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = rgb(200, 200, 200)
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    hide_input = false
    position = 0, -100
    halign = center
    valign = center
}

# CUSTOM TEXT
label {
    monitor =
    text = Welcome back, $USER
    color = rgba(200, 200, 200, 1.0)
    font_size = 20
    font_family = JetBrains Mono Nerd Font
    position = 0, -200
    halign = center
    valign = center
}
