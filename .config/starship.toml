"$schema" = 'https://starship.rs/config-schema.json'

format = """\
[┌](blue)\
[](red)\
$os\
$username\
[](bg:orange fg:red)\
$directory\
[](bg:yellow fg:orange)\
$git_branch\
$git_status\
[](fg:yellow bg:green)\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:green bg:blue)\
$conda\
[](fg:blue bg:violet)\
$time\
[ ](fg:violet)\
$cmd_duration\
$line_break\
$character"""

palette = 'solarized_dark'

add_newline = false

[os]
disabled = false
style = "bg:red fg:crust"

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = true
style_user = "bg:red fg:crust"
style_root = "bg:red fg:crust"
format = '[ $user]($style)'

[directory]
style = "bg:orange fg:crust"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:yellow"
format = '[[ $symbol $branch ](fg:crust bg:yellow)]($style)'

[git_status]
style = "bg:yellow"
format = '[[($all_status$ahead_behind )](fg:crust bg:yellow)]($style)'

[nodejs]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[c]
symbol = " "
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[rust]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[golang]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[php]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[java]
symbol = " "
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[kotlin]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[haskell]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[python]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version)(\(#$virtualenv\)) ](fg:crust bg:green)]($style)'

[docker_context]
symbol = ""
style = "bg:sapphire"
format = '[[ $symbol( $context) ](fg:crust bg:blue)]($style)'

[conda]
symbol = "  "
style = "fg:crust bg:blue"
format = '[$symbol$environment ]($style)'
ignore_base = false

[time]
disabled = false
time_format = "%R"
style = "bg:lavender"
format = '[[  $time ](fg:crust bg:violet)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[└\[λ\]](fg:cyan)'
error_symbol = '[└\[x\]](fg:red)'
vimcmd_symbol = '[❮](fg:green)'
vimcmd_replace_one_symbol = '[❮](fg:violet)'
vimcmd_replace_symbol = '[❮](fg:violet)'
vimcmd_visual_symbol = '[❮](fg:yellow)'

[cmd_duration]
show_milliseconds = true
format = " in $duration "
style = "bg:violet"
disabled = false
show_notifications = false
min_time_to_notify = 45000

# --- SOLARIZED DARK PALETTE DEFINITION ---
[palettes.solarized_dark]
# Backgrounds
base03 = "#002b36"
base02 = "#073642"
crust  = "#002b36" # Mapping 'crust' to the darkest background

# Functional Colors (Mapped to your existing format labels)
red      = "#dc322f"
orange   = "#cb4b16"
yellow   = "#b58900"
green    = "#859900"
cyan     = "#2aa198"
blue     = "#268bd2"
magenta  = "#d33682"
violet   = "#6c71c4"
