bind -n C-x split-window -h
bind -n C-z split-window -v
bind -n C-r source-file ~/.tmux.conf
bind -n C-q kill-pane

set -sg terminal-overrides ",*:RGB"  # true color support
set -g status-position bottom
set -g status on
set -g mouse off
set -qg allow-passthrough on
set -g default-shell /usr/bin/bash

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix


set -g status-style bg=default,fg=default
#set -g status-left ""
set -g status-right "BAT: #(cat /sys/class/power_supply/BAT1/capacity)%"


set -g @vim_navigator_mapping_left "C-h"  # use C-h and C-Left
set -g @vim_navigator_mapping_right "C-l"
set -g @vim_navigator_mapping_up "C-k"
set -g @vim_navigator_mapping_down "C-j"
set -g @vim_navigator_mapping_prev ""  # removes the C-\ binding

set -g @vim_navigator_prefix_mapping_clear_screen ""

# source /usr/share/powerline/bindings/tmux/powerline.conf

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

run '~/.tmux/plugins/tpm/tpm'
